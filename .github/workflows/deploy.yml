name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  NODE_ENV: test
  STAGE: dev

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Test build
      run: npm run build --if-present

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: https://eu-west-1.console.aws.amazon.com/lambda/home

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Serverless Framework globally
      run: npm install -g serverless@latest

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

    - name: Deploy to AWS
      run: npm run deploy
      env:
        STAGE: prod
        AWS_REGION: eu-west-1
        # Core
        DYNAMODB_TABLE: ${{ vars.DYNAMODB_TABLE }}
        IRANCRYPTO_API_KEY: ${{ secrets.IRANCRYPTO_API_KEY }}
        CHROMIUM_LAYER_ARN: ${{ vars.CHROMIUM_LAYER_ARN }}
        # AI
        AI_MODEL: ${{ vars.AI_MODEL }}
        AI_PROVIDER: ${{ vars.AI_PROVIDER }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_ORGANIZATION: ${{ secrets.OPENAI_ORGANIZATION }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        # Twitter
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_REFRESH_TOKEN: ${{ secrets.TWITTER_REFRESH_TOKEN }}
        TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID }}
        TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
        # Instagram
        INSTAGRAM_PROVIDER: ${{ vars.INSTAGRAM_PROVIDER }}
        AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
        LATE_API_KEY: ${{ secrets.LATE_API_KEY }}
        LATE_IG_ACCOUNT_ID: ${{ vars.LATE_IG_ACCOUNT_ID }}
        # Telegram
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        # Monitoring
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    - name: Post Deployment Notification
      if: success()
      run: |
        echo "🚀 Deployment completed successfully!"
        echo "Environment: Production"
        echo "Region: ${{ vars.AWS_REGION || 'eu-west-1' }}"
        echo "Timestamp: $(date -u)"
